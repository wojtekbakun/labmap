<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>LabMap</title>
<link rel="icon" id="favicon" href="/favicon.svg" type="image/svg+xml">
<style>
:root {
  color-scheme: light;
  --plane: #eceef2; --surface: #ffffff; --surface-2: #f5f6f8; --line: #e1e4ea; --line-2: #cdd2da; --logo-outline: transparent;
  --ink: #0f1218; --ink-2: #4a5160; --ink-3: #7c8492;
  --accent: #2a78d6; --accent-bg: #d9e7f8; --s1: #2a78d6; --s2: #eb6834;
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b;
  --warn-ink: #8a5a00; --crit-ink: #b02a2a; --warn-bg: #fff5dc; --crit-bg: #fdeaea;
  --dots: rgba(15, 18, 24, .10); --scrim: rgba(15, 18, 24, .28);
  --shadow: 0 1px 2px rgba(15, 18, 24, .04), 0 8px 28px -14px rgba(15, 18, 24, .14);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, "JetBrains Mono", Consolas, "DejaVu Sans Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane: #08090c; --surface: #0f1217; --surface-2: #151920; --line: #1e232c; --line-2: #2b313c; --logo-outline: #3a4250;
    --ink: #e8ebf0; --ink-2: #a3abb8; --ink-3: #6b7482;
    --accent: #3987e5; --accent-bg: #16263b; --s1: #3987e5; --s2: #d95926;
    --warn-ink: #fab219; --crit-ink: #f07272; --warn-bg: rgba(250, 178, 25, .09); --crit-bg: rgba(208, 59, 59, .12);
    --dots: rgba(255, 255, 255, .055); --scrim: rgba(0, 0, 0, .5);
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #08090c; --surface: #0f1217; --surface-2: #151920; --line: #1e232c; --line-2: #2b313c; --logo-outline: #3a4250;
  --ink: #e8ebf0; --ink-2: #a3abb8; --ink-3: #6b7482;
  --accent: #3987e5; --accent-bg: #16263b; --s1: #3987e5; --s2: #d95926;
  --warn-ink: #fab219; --crit-ink: #f07272; --warn-bg: rgba(250, 178, 25, .09); --crit-bg: rgba(208, 59, 59, .12);
  --dots: rgba(255, 255, 255, .055); --scrim: rgba(0, 0, 0, .5);
  --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--plane); color: var(--ink); font: 14px/1.45 var(--sans); }
body.offline main { opacity: .5; }
a { color: inherit; }
.mono { font-family: var(--mono); font-size: .93em; }
.page { max-width: 1480px; margin: 0 auto; padding: 0 24px 32px; }
svg.ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* top bar */
.top { display: flex; align-items: center; gap: 12px 16px; padding: 14px 0; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; }
.logo { width: 30px; height: 30px; flex: none; }
.logo svg { width: 30px; height: 30px; display: block; }
.logo .tile { fill: #0f1218; stroke: var(--logo-outline); }
.logo .led { fill: var(--good); transition: fill .3s; }
.logo.st-warning .led { fill: var(--warn); } .logo.st-error .led { fill: var(--crit); } .logo.st-offline .led { fill: var(--ink-3); }
h1 { font-size: 18px; line-height: 1; margin: 0; letter-spacing: -.01em; font-weight: 700; }
.top-right { display: flex; align-items: center; gap: 12px; }
.button { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--surface);
  color: var(--ink-2); font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; }
.button:hover { border-color: var(--accent); }
.button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.button svg { width: 15px; height: 15px; flex: none; }
.button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-bg); }
.live { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-3); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.live .dot { color: var(--good); animation: pulse 2s ease-in-out infinite; }
body.offline .live { color: var(--crit-ink); }
body.offline .live .dot { color: var(--crit); animation: none; }
@keyframes pulse { 50% { opacity: .25; } }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; display: inline-block; }

/* the map */
.stage {
  position: relative; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px 8px;
  background-color: var(--surface); background-image: radial-gradient(var(--dots) 1.1px, transparent 1.3px);
  background-size: 22px 22px; background-position: 11px 11px; box-shadow: var(--shadow);
}
.stage { display: flex; flex-direction: column; min-height: calc(100vh - 100px); }
#map { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
.stage-bar { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; padding: 2px 4px 4px; }
.stage-bar h2 { margin: 0; font-size: 13px; font-weight: 650; color: var(--ink-2); }
#hint { position: fixed; z-index: 25; pointer-events: none; display: none; align-items: center; gap: 6px; padding: 3px 9px 3px 8px; border-radius: 6px;
  background: var(--ink); color: var(--surface); font-size: 12px; font-weight: 600; white-space: nowrap; box-shadow: 0 4px 14px -6px rgba(0, 0, 0, .4); }
#hint .dot { width: 7px; height: 7px; color: var(--ink-3); }
#hint.st-ok .dot { color: var(--good); } #hint.st-warning .dot { color: var(--warn); } #hint.st-error .dot { color: var(--crit); }
#hint.no-dot .dot { display: none; }
#map svg { display: block; width: 100%; height: auto; max-height: calc(100vh - 140px); font-family: var(--sans); }
#map svg.narrow { max-height: none; min-height: 0; max-width: 640px; margin: 0 auto; }
.node-bg { fill: var(--surface); stroke: var(--line-2); stroke-width: 1; }
.k-pill > .node-bg { fill: var(--surface-2); }
.k-server > .node-bg { stroke: var(--accent); stroke-width: 1.5; }
.halo { fill: none; stroke: var(--accent); stroke-width: 7; opacity: .13; }
.st-warning > .node-bg { stroke: var(--warn); stroke-width: 1.5; }
.st-error > .node-bg { stroke: var(--crit); stroke-width: 1.6; }
.st-none.k-pill { opacity: .6; }
.part-bg { fill: var(--surface-2); stroke: var(--line); stroke-width: 1; }
.part.st-warning > .part-bg { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 1.5; }
.part.st-error > .part-bg { fill: var(--crit-bg); stroke: var(--crit); stroke-width: 1.6; }
.m-title { fill: var(--ink); font-weight: 650; }
.m-text { fill: var(--ink-2); }
.m-faint { fill: var(--ink-3); }
.m-mono { font-family: var(--mono); }
.m-label { fill: var(--ink-3); font-weight: 700; letter-spacing: .08em; }
.m-value { fill: var(--ink); font-weight: 650; }
.m-icon { color: var(--ink-2); }
.m-icon svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
.m-warning { fill: var(--warn-ink); font-weight: 600; }
.m-error { fill: var(--crit-ink); font-weight: 600; }
.m-dot { fill: var(--ink-3); }
.dot-target { fill: transparent; }
.st-ok > .m-dot, .m-dot.st-ok { fill: var(--good); }
.st-warning > .m-dot, .m-dot.st-warning { fill: var(--warn); }
.st-error > .m-dot, .m-dot.st-error { fill: var(--crit); }
.m-track { fill: var(--accent-bg); }
.m-bar { fill: var(--accent); }
.m-bar.warning { fill: var(--warn); } .m-bar.error { fill: var(--crit); }
.zone { fill: var(--ink-3); font-size: 11px; font-weight: 700; letter-spacing: .14em; }
.clickable { cursor: pointer; }
.clickable:hover > g > .node-bg, .clickable:focus-visible > g > .node-bg { stroke: var(--accent); stroke-width: 1.8; }
.clickable:hover > g > .part-bg, .clickable:focus-visible > g > .part-bg { stroke: var(--accent); stroke-width: 1.6; }
.clickable:focus { outline: none; }
.row-bg { fill: transparent; }
.clickable:hover > .row-bg, .clickable:focus-visible > .row-bg { fill: var(--surface-2); }
.open-bg { fill: transparent; }
.open-link .m-icon { color: var(--ink-3); }
.open-link:hover .open-bg, .open-link:focus-visible .open-bg { fill: var(--accent-bg); }
.open-link:hover .m-icon, .open-link:focus-visible .m-icon { color: var(--accent); }
.open-link:focus { outline: none; }
.wire { fill: none; stroke: var(--line-2); stroke-width: 1.5; }
.wire.thin { stroke-dasharray: 2 4; stroke-width: 1.2; }
.wire.st-none { stroke-dasharray: 3 5; opacity: .7; }
.wire.st-error { stroke: var(--crit); stroke-dasharray: 5 4; }
.flow { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 1.5 10; animation: flow .9s linear infinite; }
.flow.reverse { animation-direction: reverse; }
@keyframes flow { to { stroke-dashoffset: -11.5; } }
@media (prefers-reduced-motion: reduce) { .flow, .live .dot { animation: none; } }

/* charts (in the details) */
.spark { position: relative; height: 64px; padding-top: 4px; outline: none; touch-action: pan-y; }
.spark svg { position: absolute; inset: 4px 0 0; width: 100%; height: calc(100% - 4px); overflow: visible; }
.spark .line { fill: none; stroke: var(--s1); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.spark .line.s2 { stroke: var(--s2); }
.spark .area { fill: var(--s1); opacity: .1; }
.spark .cursor { position: absolute; top: 4px; bottom: 0; width: 1px; background: var(--ink-3); display: none; pointer-events: none; }
.spark .point { position: absolute; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--surface); box-sizing: content-box; transform: translate(-50%, -50%); display: none; pointer-events: none; background: var(--s1); }
.spark .point.s2 { background: var(--s2); }
.spark.active .cursor, .spark.active .point { display: block; }
.spark:focus-visible { box-shadow: 0 0 0 2px var(--accent); border-radius: 4px; }
#tooltip { position: fixed; z-index: 40; pointer-events: none; display: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 10px; font-size: 12px; line-height: 1.5; box-shadow: 0 8px 24px -8px rgba(0, 0, 0, .3); white-space: nowrap; font-variant-numeric: tabular-nums; }
#tooltip b { font-weight: 650; margin-right: 6px; }
#tooltip .key { display: inline-block; width: 12px; height: 2px; border-radius: 1px; vertical-align: 3px; margin-right: 7px; background: var(--s1); }
#tooltip .key.s2 { background: var(--s2); }
#tooltip .when { color: var(--ink-3); }
.legend-key { display: inline-flex; align-items: center; gap: 6px; }
.legend-key::before { content: ""; width: 12px; height: 2px; border-radius: 1px; background: var(--s1); }
.legend-key.s2::before { background: var(--s2); }

/* details of a map element */
#scrim { position: fixed; inset: 0; z-index: 30; background: var(--scrim); }
#details { position: fixed; z-index: 31; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); display: flex; flex-direction: column;
  background: var(--surface); border-left: 1px solid var(--line-2); box-shadow: -16px 0 48px -24px rgba(0, 0, 0, .45); }
#scrim[hidden], #details[hidden] { display: none; }
.d-top { display: flex; align-items: center; gap: 10px; padding: 14px 16px 14px 18px; border-bottom: 1px solid var(--line); }
.d-icon { --k: var(--ink-2); width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; flex: none;
  color: var(--k); background: color-mix(in srgb, var(--k) 14%, transparent); }
.d-icon svg { width: 18px; height: 18px; }
.d-top h2 { margin: 0; font-size: 16px; font-weight: 650; flex: 1; min-width: 0; }
.close { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink-2); cursor: pointer; display: grid; place-items: center; flex: none; }
.close:hover { border-color: var(--accent); color: var(--ink); }
.close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.close svg { width: 16px; height: 16px; }
#d-body { overflow-y: auto; padding: 2px 18px 24px; }
.d-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
.d-state { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.d-state.st-ok .dot { color: var(--good); } .d-state.st-warning .dot { color: var(--warn); } .d-state.st-error .dot { color: var(--crit); } .d-state.st-none .dot { color: var(--ink-3); }
.d-open { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; font-size: 13px; text-decoration: none; white-space: nowrap; }
.d-open:hover { filter: brightness(1.1); }
.d-open:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.d-open svg { width: 14px; height: 14px; }
.d-desc { color: var(--ink-2); font-size: 13px; margin: 12px 0 0; }
.d-alert { margin-top: 12px; padding: 9px 12px; border-radius: 8px; border-left: 3px solid var(--warn); background: var(--warn-bg); font-size: 13px; }
.d-alert.error { border-left-color: var(--crit); background: var(--crit-bg); }
.d-alert.info { border-left-color: var(--accent); background: var(--accent-bg); }
.d-chart { margin-top: 14px; padding: 11px 12px 8px; border: 1px solid var(--line); border-radius: 10px; }
.d-chart-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 2px; }
.d-chart-top b { color: var(--ink); font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
.d-chart-bottom { display: flex; gap: 14px; font-size: 11.5px; color: var(--ink-3); margin-top: 4px; }
.d-section h3 { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 20px 0 2px; }
.d-section dl { margin: 0; }
.d-pair { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.d-pair:last-child { border-bottom: 0; }
.d-pair dt { color: var(--ink-2); flex: none; display: inline-flex; align-items: center; gap: 7px; }
.d-pair dt .dot { width: 7px; height: 7px; }
.d-pair dt .dot.st-ok { color: var(--good); } .d-pair dt .dot.st-warning { color: var(--warn); } .d-pair dt .dot.st-error { color: var(--crit); }
.d-pair dd { margin: 0; text-align: right; font-weight: 550; min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.d-pair a { color: var(--accent); text-decoration: none; font-family: var(--mono); font-size: 12.5px; }
.d-pair a:hover { text-decoration: underline; }
.d-login { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.d-login:last-child { border-bottom: 0; }
.d-login-name { color: var(--ink-2); margin-bottom: 5px; }
.d-login-data { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.d-login-notes { color: var(--ink-3); font-size: 12px; margin-top: 5px; }
.password { font-family: var(--mono); font-size: 12.5px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); padding: 1px 7px; border-radius: 5px; user-select: all; -webkit-user-select: all; }
.hidden-value { color: var(--ink-3); font-weight: 500; font-style: italic; }
.d-test { margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 10px; }
.d-test-numbers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.d-test-numbers > div > span { display: block; font-size: 12px; color: var(--ink-2); }
.d-test-numbers b { display: block; font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; color: var(--ink); line-height: 1.25; }
.d-test-numbers b small { font-size: 13px; font-weight: 550; color: var(--ink-2); margin-left: 3px; }
.d-test-numbers .waiting b { color: var(--ink-3); }
.d-test-numbers .current b { color: var(--accent); }
.d-test-max { font-size: 11.5px; color: var(--ink-3); }
.d-test-bottom { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-3); }
.d-test-error { font-size: 12.5px; color: var(--crit-ink); margin-top: 8px; }
.d-button { padding: 5px 11px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink); font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.d-button:hover:not(:disabled) { border-color: var(--accent); }
.d-button:disabled { color: var(--ink-3); cursor: default; }
.d-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.d-faint { color: var(--ink-3); font-size: 12.5px; padding: 8px 0; }
@media (max-width: 600px) {
  .page { padding: 0 16px 24px; }
  .top { padding: 12px 0 10px; gap: 8px; }
  #privacy span, .live span:last-child { display: none; }
  #privacy { padding: 5px 8px; }
  body.offline .live span:last-child { display: inline; }
  .stage { padding: 8px 6px 6px; border-radius: 12px; min-height: 0; }
  .stage-bar { padding: 2px 6px 4px; }
  #details { top: auto; left: 0; width: 100%; max-height: 86vh; border-left: 0; border-top: 1px solid var(--line-2); border-radius: 16px 16px 0 0; }
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="brand">
      <div class="logo" id="logo" aria-hidden="true"><svg viewBox="0 0 64 64"><rect class="tile" x=".75" y=".75" width="62.5" height="62.5" rx="14.5" stroke-width="1.5"/><rect x="16.25" y="11" width="9" height="42" rx="4.5" fill="#fff"/><circle class="led" cx="39.25" cy="44.5" r="12" opacity=".22"/><circle class="led" cx="39.25" cy="44.5" r="8.5"/></svg></div>
      <h1 id="hostname">LabMap</h1>
    </div>
    <div class="top-right">
      <button class="button" id="privacy" type="button" aria-pressed="false" title="Hides IP addresses, device names, versions and passwords – for when you show the page to someone"></button>
      <span class="live" title="Refreshes every 3 s"><i class="dot"></i><span id="clock">—</span></span>
    </div>
  </header>
  <main>
    <section class="stage" aria-labelledby="map-title">
      <div class="stage-bar">
        <h2 id="map-title">Server map</h2>
      </div>
      <div id="map"></div>
    </section>
  </main>
</div>
<div id="scrim" hidden></div>
<aside id="details" role="dialog" aria-modal="true" aria-labelledby="d-title" hidden>
  <div class="d-top">
    <span class="d-icon" id="d-icon"></span>
    <h2 id="d-title"></h2>
    <button class="close" id="d-close" type="button" aria-label="Close details"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div id="d-body"></div>
</aside>
<div id="tooltip" role="tooltip"></div>
<div id="hint" role="tooltip"><i class="dot"></i><span></span></div>
<script>
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const REFRESH = 3000;
const HISTORY = 150, HISTORY_STEP = 2;  // 150 samples every 2 s = 5 min
let latest = null;

// --- helpers -------------------------------------------------------------------------------
function build(e, attrs, children) {
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    e.setAttribute(k, v);
  }
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false || c === '') continue;
    e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return e;
}
const el = (tag, attrs, ...children) => build(document.createElement(tag), attrs, children);
const sv = (tag, attrs, ...children) => build(document.createElementNS(NS, tag), attrs, children);
let pressed = 0;  // when a button or finger went down – don't rebuild then, so the click isn't lost
let pointerOver = null;  // the chart under the cursor – don't rebuild it, so the reading doesn't jump
window.addEventListener('pointerdown', e => { if (e.button === 0) pressed = Date.now(); }, true);
for (const t of ['pointerup', 'pointercancel', 'contextmenu', 'dragstart'])
  window.addEventListener(t, () => { pressed = 0; }, true);
window.addEventListener('blur', () => { pressed = 0; });  // no capture: only when the whole window loses focus
function busy(e) {  // selected text, keyboard focus, cursor on a chart or a click in progress in this section
  const sel = getSelection();
  let focus = false;
  try { focus = !!e.querySelector(':focus-visible'); } catch (_) {}
  return (pressed > 0 && Date.now() - pressed < 2000) || focus || (!!pointerOver && e.contains(pointerOver))
    || (!!sel && !sel.isCollapsed && e.contains(sel.anchorNode));
}
function replace(id, ...children) {
  const e = document.getElementById(id);
  if (busy(e)) return;
  const fresh = build(document.createElement('div'), {}, children);

    try { await done; } catch (e) { if (!sent) throw e; break; } finally { clearTimeout(timer); }

    end = performance.now();

async function browserTest() {

  const via = (test.me || await whoAmI()).via;
  test.running = {via, stage: 'download'};
  test.error = null;
  refreshTest();
  try {
    const ping = await measurePing();
    const download = await measureDownload(v => { test.running.download = v; refreshTest(true); });
    test.running = {...test.running, stage: 'upload', download};
    refreshTest();
    const upload = await measureUpload(v => { test.running.upload = v; refreshTest(true); });
    test.result = {via, ping, download, upload, time: serverNow()};
  } catch (e) {
    test.error = {via, text: e.message || String(e)};
  } finally {
    test.running = null;
    refreshTest();

}
async function internetTest(start) {

    const resp = await fetch('/api/test/internet', {method: start ? 'POST' : 'GET', headers: TEST_HEADERS, cache: 'no-store'});
    if (!resp.ok) throw new Error();
    test.internet = await resp.json();
  } catch (_) {
    test.internet = {...test.internet, running: false, error: {text: 'no connection to the server', time: Date.now() / 1000}};
  }

  if (test.internet.running && opened === 'wifi') test.timer = setTimeout(() => internetTest(false), 1000);

}

// --- main loop ---------------------------------------------------------------------------------
// The dot in the logo and in the browser tab shows the worst state, so a problem is visible from another tab too.
const BRAND_COLOR = {ok: '#12b312', warning: '#fab219', error: '#e5484d', offline: '#6b7482'};
let brandState = '';
function setBrandState(state) {
  if (state === brandState) return;
  brandState = state;
  document.getElementById('logo').className = 'logo st-' + state;
  const c = BRAND_COLOR[state];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#0f1218"/>` +
    `<rect x="16.25" y="11" width="9" height="42" rx="4.5" fill="#fff"/><circle cx="39.25" cy="44.5" r="12" fill="${c}" opacity=".22"/>` +
    `<circle cx="39.25" cy="44.5" r="8.5" fill="${c}"/></svg>`;
  document.getElementById('favicon').href = 'data:image/svg+xml,' + encodeURIComponent(svg);
}
function render(s) {
  const h = s.host || {};
  // the header always shows the product name; the server's name goes into the tab title
  document.title = h.name ? `${h.name} · LabMap` : 'LabMap';
  const alerts = s.alerts || [];
  setBrandState(alerts.some(a => a.level === 'error') ? 'error' : alerts.some(a => a.level === 'warning') ? 'warning' : 'ok');
  document.getElementById('clock').textContent = new Date((s.time || Date.now() / 1000) * 1000).toLocaleTimeString();
  if (!s.ready) return;  // the first second after startup: the slow data is still being collected
  drawMap(s);
  if (opened) renderDetails(s, false);
}
let loading = false;
async function refresh() {
  if ((document.hidden && latest) || loading) return;
  loading = true;
  const ac = new AbortController(), timer = setTimeout(() => ac.abort(), 6000);  // a dead server won't freeze the page
  try {
    const resp = await fetch('/api/state', {cache: 'no-store', signal: ac.signal});
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    latest = await resp.json();
  } catch (e) {
    document.body.classList.add('offline');
    setBrandState('offline');
    document.getElementById('clock').textContent = 'no connection to the server';
    return;
  } finally {
    clearTimeout(timer);
    loading = false;
  }
  document.body.classList.remove('offline');
  try { render(latest); } catch (e) { console.error('LabMap failed to draw the page:', e); }  // a page error isn't a lost connection
  if (!latest.ready) setTimeout(refresh, 800);
}
let lastWidth = 0;
window.addEventListener('resize', () => {
  const w = document.getElementById('map').clientWidth;
  if (latest && latest.ready && Math.abs(w - lastWidth) > 20) { lastWidth = w; drawMap(latest); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
window.addEventListener('scroll', hideTooltip, {passive: true});
setPrivacy(privateMode);
refresh();
setInterval(refresh, REFRESH);
