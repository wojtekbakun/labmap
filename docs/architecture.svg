<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .tlo { fill: #f6f7f9; }
    .karta { fill: #ffffff; stroke: #d5d9e0; stroke-width: 1.2; }
    .glowna { fill: #ffffff; stroke: #2f6fd6; stroke-width: 1.8; }
    .zrodlo { fill: #ffffff; stroke: #d5d9e0; stroke-width: 1.2; }
    .t1 { fill: #12151b; font-size: 15px; font-weight: 650; }
    .t2 { fill: #4a5261; font-size: 12.5px; }
    .t3 { fill: #7a8291; font-size: 11px; font-weight: 700; letter-spacing: .1em; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; fill: #2f6fd6; }
    .linia { stroke: #aab2bf; stroke-width: 1.4; fill: none; }
    .strzalka { fill: #aab2bf; }
    .akcent { stroke: #2f6fd6; stroke-width: 1.8; fill: none; stroke-dasharray: 2 6; stroke-linecap: round; }
    .pas { fill: #eaf1fc; }
    @media (prefers-color-scheme: dark) {
      .tlo { fill: #0f1217; }
      .karta, .zrodlo { fill: #151920; stroke: #2b313c; }
      .glowna { fill: #151920; stroke: #4c8ef0; }
      .t1 { fill: #e9edf3; } .t2 { fill: #a3acba; } .t3 { fill: #7d8796; }
      .mono { fill: #6aa3f5; }
      .linia { stroke: #3a4250; } .strzalka { fill: #3a4250; }
      .akcent { stroke: #4c8ef0; }
      .pas { fill: #1a2638; }
    }
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="strzalka"/>
    </marker>
  </defs>
  <rect class="tlo" width="960" height="500" rx="16"/>

  <!-- browser -->
  <text class="t3" x="30" y="40">YOU</text>
  <rect class="karta" x="30" y="170" width="190" height="120" rx="12"/>
  <text class="t1" x="48" y="200">Browser</text>
  <text class="t2" x="48" y="224">phone · laptop · tablet</text>
  <text class="t2" x="48" y="244">map refreshes every 3 s</text>
  <text class="t2" x="48" y="264">click anything for details</text>

  <path class="linia" d="M220 230 H300" marker-end="url(#g)" marker-start="url(#g)"/>
  <path class="akcent" d="M224 230 H296"/>
  <text class="t2" x="228" y="214" font-size="11">LAN cable</text>
  <text class="t2" x="228" y="254" font-size="11">or Tailscale</text>

  <!-- labmap.py -->
  <text class="t3" x="305" y="40">YOUR SERVER</text>
  <rect class="glowna" x="305" y="56" width="330" height="318" rx="14"/>
  <rect class="pas" x="306" y="57" width="328" height="58" rx="13"/>
  <text class="t1" x="325" y="84" font-size="17">labmap.py</text>
  <text class="t2" x="325" y="104">one file · Python standard library only</text>
  <text class="mono" x="325" y="142">GET /</text>
  <text class="t2" x="440" y="142">the map (single HTML file)</text>
  <text class="mono" x="325" y="166">GET /api/state</text>
  <text class="t2" x="440" y="166">state + alerts as JSON</text>
  <text class="mono" x="325" y="190">/api/test/*</text>
  <text class="t2" x="440" y="190">speed tests</text>
  <line class="linia" x1="325" y1="210" x2="615" y2="210"/>
  <text class="t2" x="325" y="236">• alerts know where they belong –</text>
  <text class="t2" x="337" y="254">the matching part of the map glows</text>
  <text class="t2" x="325" y="278">• 5-minute history for every chart</text>
  <text class="t2" x="325" y="302">• runs as a sandboxed systemd service</text>
  <text class="t2" x="325" y="326">• only LAN cable / Tailscale may connect</text>
  <text class="t2" x="325" y="350">• edits apply live, no restart</text>

  <!-- config -->
  <rect class="karta" x="335" y="410" width="270" height="62" rx="12"/>
  <text class="t1" x="353" y="435" font-size="13.5">Config (plain JSON)</text>
  <text class="mono" x="353" y="457">services · secrets · logins</text>
  <path class="linia" d="M470 410 V378" marker-end="url(#g)"/>

  <!-- sources -->
  <text class="t3" x="700" y="40">WHAT IT READS</text>
  <g>
    <rect class="zrodlo" x="700" y="56" width="230" height="48" rx="10"/>
    <text class="t1" x="716" y="76" font-size="13">/proc · /sys</text>
    <text class="t2" x="716" y="94" font-size="11.5">CPU, RAM, temperatures, fan</text>
    <rect class="zrodlo" x="700" y="112" width="230" height="48" rx="10"/>
    <text class="t1" x="716" y="132" font-size="13">Battery · USB-C PD</text>
    <text class="t2" x="716" y="150" font-size="11.5">charger watts, charge limits</text>
    <rect class="zrodlo" x="700" y="168" width="230" height="48" rx="10"/>
    <text class="t1" x="716" y="188" font-size="13">mdadm RAID</text>
    <text class="t2" x="716" y="206" font-size="11.5">disks, sync, free space, I/O</text>
    <rect class="zrodlo" x="700" y="224" width="230" height="48" rx="10"/>
    <text class="t1" x="716" y="244" font-size="13">Docker socket</text>
    <text class="t2" x="716" y="262" font-size="11.5">containers, health, restarts</text>
    <rect class="zrodlo" x="700" y="280" width="230" height="48" rx="10"/>
    <text class="t1" x="716" y="300" font-size="13">Network</text>
    <text class="t2" x="716" y="318" font-size="11.5">Wi-Fi (nl80211), Tailscale, LAN</text>
    <rect class="zrodlo" x="700" y="336" width="230" height="48" rx="10"/>
    <text class="t1" x="716" y="356" font-size="13">App APIs</text>
    <text class="t2" x="716" y="374" font-size="11.5">Immich, Nextcloud, any port</text>
  </g>
  <path class="linia" d="M700 80 H680 V346 H700 M680 136 H700 M680 192 H700 M680 248 H700 M680 304 H700"/>
  <path class="linia" d="M680 215 H640" marker-end="url(#g)"/>
</svg>
